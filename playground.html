<!doctype html>
<!-- Dev-only page for hand-checking the rules engine. Not linked from index.html and not part of the production build. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scrub engine playground</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0 auto; padding: 16px; max-width: 48rem; }
      textarea { box-sizing: border-box; width: 100%; min-height: 8rem; font: inherit; }
      #highlighted { white-space: pre-wrap; word-break: break-word; border: 1px solid; padding: 8px; }
      mark { outline: 2px solid; padding: 0 2px; }
      mark b { font-size: 0.75em; }
      table { border-collapse: collapse; width: 100%; margin-top: 12px; }
      th, td { border: 1px solid; padding: 4px; text-align: left; word-break: break-all; }
    </style>
  </head>
  <body>
    <h1>Engine playground (dev only)</h1>
    <p>Runs entirely in this page. Nothing is sent or saved.</p>
    <label for="input">Type or paste text</label>
    <textarea id="input"></textarea>
    <h2>Highlighted</h2>
    <div id="highlighted"></div>
    <div aria-live="polite">
      <table>
        <thead><tr><th>Type</th><th>Value</th><th>Start–End</th><th>Confidence</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <script type="module" src="/src/ui/playground.ts"></script>
  </body>
</html>
